<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page de test</title>
<style>
  :root {
    color-scheme: dark;
  }
  * {
    box-sizing: border-box;
  }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(-45deg, #0f2027, #2c5364, #6a3093, #1e3c72);
    background-size: 400% 400%;
    animation: drift 16s ease infinite;
    color: #f5f5f5;
    text-align: center;
    overflow: hidden;
  }
  @keyframes drift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  main {
    max-width: 32rem;
  }
  h1 {
    font-size: clamp(2.2rem, 8vw, 3.6rem);
    margin: 0 0 0.8rem;
    letter-spacing: -0.02em;
    background: linear-gradient(90deg, #ffffff, #a0d9ff, #ffffff);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: shine 5s linear infinite;
  }
  @keyframes shine {
    to { background-position: 200% center; }
  }
  p {
    font-size: clamp(1rem, 3vw, 1.25rem);
    opacity: 0.85;
    margin: 0;
    line-height: 1.5;
  }
  .dot {
    display: inline-block;
    width: 0.5em;
    height: 0.5em;
    margin-left: 0.3em;
    border-radius: 50%;
    background: #a0d9ff;
    animation: pulse 1.6s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(1.6); opacity: 0.4; }
  }
</style>
</head>
<body>
  <main>
    <h1>Ça marche&nbsp;!</h1>
    <p>
      Page de test de thderoo, publiée depuis ce dépôt sur GitHub Pages.
      <span class="dot"></span>
    </p>
  </main>
</body>
</html>
