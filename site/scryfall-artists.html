<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>Scryfall artists, sets &amp; cards</title>
<style>
  :root {
    --bg: #f6f6f3;
    --fg: #1c1c1a;
    --muted: #66665f;
    --line: #d9d9d2;
    --empty: #bdbdb5;
    --card: #ffffff;
    --accent: #2453a6;
    --error: #b3261e;
    --badge-bg: rgba(20, 20, 18, 0.82);
    --badge-fg: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413;
      --fg: #ebebe6;
      --muted: #9a9a92;
      --line: #35352f;
      --empty: #4a4a44;
      --card: #1e1e1c;
      --accent: #8fb3f0;
      --error: #f2b8b5;
      --badge-bg: rgba(0, 0, 0, 0.78);
      --badge-fg: #ffffff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #141413;
    --fg: #ebebe6;
    --muted: #9a9a92;
    --line: #35352f;
    --empty: #4a4a44;
    --card: #1e1e1c;
    --accent: #8fb3f0;
    --error: #f2b8b5;
    --badge-bg: rgba(0, 0, 0, 0.78);
    --badge-fg: #ffffff;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  a { color: var(--accent); }
  a:focus-visible, button:focus-visible, input:focus-visible, select:focus-visible,
  .artist .hit:focus-visible, .zoom-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  [hidden] { display: none !important; }

  header.bar {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: 12px 16px;
  }
  .bar-top {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    max-width: 1400px;
    margin: 0 auto 8px;
  }
  .bar h1 { font-size: 1.2rem; margin: 0; font-weight: 650; }
  .tabs { display: flex; gap: 4px; }
  .tab {
    padding: 5px 12px;
    border-radius: 6px;
    color: var(--muted);
    text-decoration: none;
    font-weight: 600;
  }
  .tab:hover { color: var(--fg); background: var(--line); }
  .tab[aria-current="page"] { color: var(--fg); background: var(--line); }
  #refresh { margin-left: auto; }
  .sortgroup { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    max-width: 1400px;
    margin: 0 auto;
  }
  .controls input[type="search"] {
    flex: 1 1 220px;
    min-width: 0;
    font: inherit;
    padding: 7px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    color: var(--fg);
  }
  .controls select, .controls button, .back, .btn {
    font: inherit;
    padding: 6px 10px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--card);
    color: var(--fg);
    cursor: pointer;
  }
  .btn:disabled { opacity: .6; cursor: default; }
  .controls label.sortlabel { color: var(--muted); font-size: .9rem; }
  .count { color: var(--muted); font-size: .9rem; margin-left: auto; }
  @media (max-width: 480px) {
    .controls input[type="search"] { flex-basis: 100%; }
    .controls select { flex: 1 1 0; min-width: 0; }
    .count { margin-left: 0; }
    .detail-controls .altonly { flex-basis: 100%; }
    .sortgroup { flex: 1 1 100%; }
    .sortgroup select { flex: 1 1 0; min-width: 0; }
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1400px;
    margin: 0 auto;
    padding: 16px;
  }

  /* Loading card: progress bar or error. */
  .float {
    position: fixed;
    z-index: 40;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(420px, calc(100vw - 32px));
    box-sizing: border-box;
    padding: 16px;
    background: var(--card);
    color: var(--fg);
    border: 1px solid var(--line);
    border-radius: 10px;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .3);
  }
  .float[hidden] { display: none; }
  /* While an old list is visible: bottom right, and bottom full width on narrow screens. */
  .float.corner { left: auto; right: 16px; bottom: 16px; top: auto; transform: none; }
  .float-step { margin: 0 0 8px; font-weight: 650; }
  .float progress {
    display: block;
    width: 100%;
    height: 10px;
    margin-bottom: 8px;
    accent-color: var(--accent);
  }
  #progress-text { margin: 0 0 8px; color: var(--muted); font-size: .9rem; }
  #loader-error { color: var(--error); margin: 0 0 10px; }
  #status { color: var(--muted); margin: 24px 0; }

  .cards {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr));
    gap: 24px;
  }
  .artist {
    position: relative;
    background: var(--line);
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
    min-width: 0;
  }
  .artist h2 { font-size: 1.05rem; margin: 0 0 2px; font-weight: 650; overflow-wrap: anywhere; color: #fff; }
  .artist:hover h2 { text-decoration: underline; }
  /* Whole card is one link: a transparent layer over it, under the text. */
  .artist .hit { position: absolute; inset: 0; z-index: 1; border-radius: 8px; }

  .stats-line .nowrap { white-space: nowrap; }
  .stats-line {
    margin: 0;
    font-size: .85rem;
    line-height: 1.35;
    opacity: .9;
  }

  /* Text sitting on the bottom of an image, over a dark gradient. */
  .cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 2;
    padding: 36px 12px 10px;
    background: linear-gradient(to top, rgba(0, 0, 0, .75), rgba(0, 0, 0, 0));
    color: #fff;
    pointer-events: none;
  }

  /* Four previews, 2 x 2, edge to edge, each at the native ratio of art_crop. */
  .previews {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0;
  }
  .preview {
    position: relative;
    display: block;
    overflow: hidden;
    background: var(--line);
    min-width: 0;
  }
  .preview .placeholder { border: 0; border-radius: 0; aspect-ratio: 4 / 3; }
  .preview img {
    display: block;
    width: 100%;
    aspect-ratio: 4 / 3;
    object-fit: cover;
  }
  .preview.empty { aspect-ratio: 4 / 3; background: var(--empty); }
  .badges {
    position: absolute;
    left: 4px;
    right: 4px;
    top: 4px;
    display: flex;
    flex-wrap: wrap;
    gap: 3px;
  }
  .badge {
    background: var(--badge-bg);
    color: var(--badge-fg);
    font-size: .7rem;
    line-height: 1;
    padding: 3px 5px;
    border-radius: 4px;
    white-space: nowrap;
  }
  .placeholder {
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    font-size: .8rem;
    color: var(--muted);
    border: 1px dashed var(--line);
    border-radius: 6px;
    background: var(--bg);
  }

  #detail-head { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-bottom: 12px; }
  #detail-head h2 { font-size: 1.3rem; margin: 0; overflow-wrap: anywhere; }
  #detail-meta { color: var(--muted); font-size: .9rem; margin: 0 0 12px; }
  .altonly { display: inline-flex; align-items: center; gap: 6px; font-size: .9rem; margin-right: 8px; }
  .detail-controls { margin: 0 0 12px; max-width: none; }
  #detail-status { color: var(--muted); }
  #works {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr));
    gap: 12px;
  }
  .work { margin: 0; min-width: 0; }
  /* Clicking the illustration enlarges it; the card name links to its Scryfall page. */
  .work-frame {
    position: relative;
    display: block;
    border-radius: 6px;
    overflow: hidden;
    background: var(--line);
    aspect-ratio: 4 / 3;
    color: #fff;
  }
  .work-frame .zoom-btn {
    display: block;
    width: 100%;
    height: 100%;
    padding: 0;
    border: 0;
    background: none;
    cursor: zoom-in;
  }
  .zoom-btn:focus-visible { outline-offset: -2px; }
  .work-frame img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .work-frame .placeholder { height: 100%; aspect-ratio: auto; border: 0; border-radius: 0; }
  .work-frame .cap { font-size: .9rem; }
  .work-frame .cap-name {
    display: block;
    width: fit-content;
    max-width: 100%;
    font-weight: 650;
    overflow-wrap: anywhere;
    color: #fff;
    text-decoration: none;
    pointer-events: auto;
  }
  .work-frame .cap-name:hover { text-decoration: underline; }
  .work-frame span.cap-name { pointer-events: none; }
  .work-frame span.cap-name:hover { text-decoration: none; }
  .work-frame .cap-meta { display: block; font-size: .8rem; opacity: .9; }
  .cap-link { color: #fff; text-decoration: none; pointer-events: auto; }
  .cap-link:hover { text-decoration: underline; }
  #detail-meta a { color: var(--accent); }

  /* Enlarged card, opened by a click in the artist view: the image at its own size
     (shrunk only to fit), and on its right the menu of Scryfall image formats. */
  #zoom {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: rgba(0, 0, 0, .75);
    cursor: zoom-out;
  }
  #zoom[hidden] { display: none !important; }
  .zoom-panel { display: flex; align-items: center; gap: 32px; max-width: 100%; max-height: 100%; }
  /* The figure never shrinks: the stage is sized to fit, so the image cannot slide under the side panel. */
  #zoom figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 8px; flex: none; cursor: default; }
  #zoom img { display: block; max-width: 100%; }
  #zoom img.round { border-radius: 4.75% / 3.4%; }  /* card corners: ~3 mm on 63 x 88 mm, hides the JPEG's white corners */
  /* Right of the image: what the card is (with links), then the format menu. */
  .zoom-side {
    flex: 0 0 240px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    max-height: calc(100vh - 32px);
    cursor: default;
  }
  .zoom-info {
    padding: 10px 12px;
    border-radius: 8px;
    background: var(--card);
    color: var(--fg);
    font-size: .9rem;
    line-height: 1.4;
    overflow-wrap: anywhere;
  }
  .zoom-info a { color: var(--fg); }
  .zoom-info .zi-name { display: block; font-weight: 650; font-size: 1rem; margin-bottom: 2px; }
  .zoom-info .zi-file { margin-top: 6px; color: var(--muted); font-size: .85rem; }
  .zoom-info .zi-file a { color: var(--muted); }
  /* Fixed-size stage (the HD card fitted to the screen): the menu beside it stays put when the format changes. */
  .zoom-stage { display: flex; align-items: center; justify-content: center; }
  #zoom-menu {
    min-height: 0;
    overflow-y: auto;
    padding: 6px;
    border-radius: 8px;
    background: var(--card);
    color: var(--fg);
    cursor: default;
  }
  .fmt {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    width: 100%;
    padding: 6px 10px;
    border: 0;
    border-radius: 6px;
    background: none;
    color: inherit;
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .fmt:hover { background: var(--line); }
  .fmt[aria-current="true"] { background: var(--line); font-weight: 650; }
  .fmt .fmt-type { color: var(--muted); font-size: .8rem; align-self: center; }
  @media (max-width: 719px) {
    .zoom-panel { flex-direction: column; gap: 16px; }
    .zoom-side { flex: none; width: 100%; max-height: none; }
    #zoom-menu { display: flex; flex-wrap: wrap; gap: 4px; }
    .fmt { width: auto; }
    .fmt[aria-current="true"] { font-weight: inherit; }   /* bold would widen the chip and rewrap the rows */
  }

  .sentinel { height: 1px; }

  footer {
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: .85rem;
    padding: 16px;
    text-align: center;
  }
  footer p { margin: 4px 0; }

  @media (max-width: 480px) {
    header.bar { padding: 10px 12px; }
    main { padding: 12px; }
    .count { margin-left: 0; width: 100%; }
    .float.corner { left: 16px; right: 16px; width: auto; }
  }
</style>
</head>
<body>

<header class="bar" id="bar">
  <div class="bar-top">
    <h1>Scryfall artists, sets &amp; cards</h1>
    <nav class="tabs" aria-label="Lists">
      <a href="#" id="tab-artists" class="tab">Artists</a>
      <a href="#sets" id="tab-sets" class="tab">Sets</a>
      <a href="#cards" id="tab-cards" class="tab">Cards</a>
    </nav>
    <button type="button" id="refresh" class="btn" hidden>Refresh from Scryfall</button>
  </div>
  <div class="controls" id="artist-controls">
    <input type="search" id="q" placeholder="Search by name" aria-label="Search artists by name" autocomplete="off">
    <label class="sortlabel" for="sort">Sort by</label>
    <select id="sort">
      <option value="illustrations">Illustrations</option>
      <option value="printings">Printings</option>
      <option value="cards">Distinct card names</option>
      <option value="alt_illustrations">Alternative illustrations</option>
      <option value="name">Name</option>
      <option value="first_year">First year</option>
      <option value="last_year">Last year</option>
    </select>
    <button type="button" id="dir" aria-label="Sort direction">Descending</button>
    <span class="count" id="count" aria-live="polite"></span>
  </div>
  <div class="controls" id="set-controls" hidden>
    <input type="search" id="set-q" placeholder="Search by name or code" aria-label="Search sets by name or code" autocomplete="off">
    <span class="sortgroup">
      <label class="sortlabel" for="set-type">Type</label>
      <select id="set-type"></select>
    </span>
    <span class="sortgroup">
    <label class="sortlabel" for="set-sort">Sort by</label>
    <select id="set-sort">
      <option value="released">Release date</option>
      <option value="name">Name</option>
      <option value="illustrations">Illustrations</option>
      <option value="printings">Printings</option>
      <option value="artists">Artists</option>
      <option value="alt_illustrations">Alternative illustrations</option>
    </select>
    <button type="button" id="set-dir" aria-label="Sort direction">Descending</button>
    </span>
    <span class="count" id="set-count" aria-live="polite"></span>
  </div>
  <div class="controls" id="card-controls" hidden>
    <input type="search" id="card-q" placeholder="Search by card name" aria-label="Search cards by name" autocomplete="off">
    <span class="sortgroup">
    <label class="sortlabel" for="card-sort">Sort by</label>
    <select id="card-sort">
      <option value="illustrations">Illustrations</option>
      <option value="printings">Printings</option>
      <option value="artists">Artists</option>
      <option value="sets">Sets</option>
      <option value="alt_illustrations">Alternative illustrations</option>
      <option value="name">Name</option>
      <option value="first_year">First year</option>
      <option value="last_year">Last year</option>
    </select>
    <button type="button" id="card-dir" aria-label="Sort direction">Descending</button>
    </span>
    <span class="count" id="card-count" aria-live="polite"></span>
  </div>
</header>

<main>

  <p id="status" hidden></p>

  <section id="list-view" hidden>
    <div id="list" class="cards"></div>
    <div id="sentinel" class="sentinel" aria-hidden="true"></div>
  </section>

  <section id="set-list-view" hidden>
    <div id="set-list" class="cards"></div>
    <div id="set-sentinel" class="sentinel" aria-hidden="true"></div>
  </section>

  <section id="card-list-view" hidden>
    <div id="card-list" class="cards"></div>
    <div id="card-sentinel" class="sentinel" aria-hidden="true"></div>
  </section>

  <section id="detail" hidden>
    <div id="detail-head">
      <button type="button" class="back" id="back">Back</button>
      <h2 id="detail-name"></h2>
    </div>
    <p id="detail-meta"></p>
    <div class="controls detail-controls">
      <label class="altonly"><input type="checkbox" id="alt-only"> Alternative only</label>
      <span class="sortgroup" id="artist-work-sorting">
        <label class="sortlabel" for="work-sort">Sort by</label>
        <select id="work-sort">
          <option value="released">Release date</option>
          <option value="name">Card name</option>
          <option value="set_name">Set</option>
          <option value="printings">Printings</option>
        </select>
        <button type="button" id="work-dir" aria-label="Sort direction">Ascending</button>
      </span>
      <span class="sortgroup" id="set-work-sorting" hidden>
        <label class="sortlabel" for="set-work-sort">Sort by</label>
        <select id="set-work-sort">
          <option value="number">Collector number</option>
          <option value="released">Release date</option>
          <option value="name">Card name</option>
          <option value="artist">Artist</option>
          <option value="printings">Printings</option>
        </select>
        <button type="button" id="set-work-dir" aria-label="Sort direction">Ascending</button>
      </span>
      <span class="sortgroup" id="card-work-sorting" hidden>
        <label class="sortlabel" for="card-work-sort">Sort by</label>
        <select id="card-work-sort">
          <option value="released">Release date</option>
          <option value="artist">Artist</option>
          <option value="set_name">Set</option>
          <option value="printings">Printings</option>
        </select>
        <button type="button" id="card-work-dir" aria-label="Sort direction">Ascending</button>
      </span>
    </div>
    <p id="detail-status" hidden></p>
    <div id="works"></div>
    <div id="works-sentinel" class="sentinel" aria-hidden="true"></div>
  </section>
</main>

<footer>
  <p id="source"></p>
  <p>Images © their respective artists and Wizards of the Coast, via Scryfall.</p>
</footer>

<!-- Loading card: floats over the page. Centred when there is no data yet, bottom right while an old list stays visible. -->
<div id="float" class="float" role="status" aria-live="polite" hidden>
  <p id="float-step" class="float-step"></p>
  <progress id="progress" max="1" value="0"></progress>
  <p id="progress-text"></p>
  <p id="loader-error" role="alert" hidden></p>
  <button type="button" id="retry" class="btn" hidden>Try again</button>
</div>

<div id="zoom" hidden>
  <div class="zoom-panel">
    <figure>
      <div class="zoom-stage" id="zoom-stage"><img id="zoom-img" alt=""></div>
    </figure>
    <aside class="zoom-side">
      <div class="zoom-info" id="zoom-cap"></div>
      <nav id="zoom-menu" aria-label="Image formats"></nav>
    </aside>
  </div>
</div>

<script>
(() => {
  'use strict';

  // ---------- Web Worker: download, decompress, aggregate ----------
  // Runs inside a Blob worker. It must stay self-contained: it is serialised
  // with Function.prototype.toString(). The logic mirrors
  // datasets/scryfall-artists/build.py of global-workspace (keep both aligned).
  function workerMain() {
    'use strict';
    const BULK_URL = 'https://api.scryfall.com/bulk-data';
    const BULK_TYPE = 'default_cards';
    const PREVIEW_SIZE = 4;
    const ALT_PROMO_TYPES = new Set([
      'japanshowcase', 'schinesealtart', 'godzillaseries', 'draculaseries',
      'concept', 'poster', 'sourcematerial',
    ]);

    // Code point order, as Python compares strings (JS compares UTF-16 units).
    function cpCmp(a, b) {
      const n = Math.min(a.length, b.length);
      for (let i = 0; i < n; i++) {
        let x = a.charCodeAt(i), y = b.charCodeAt(i);
        if (x !== y) {
          if (x >= 0xd800 && x <= 0xdfff) x += 0x2000; else if (x >= 0xe000) x -= 0x800;
          if (y >= 0xd800 && y <= 0xdfff) y += 0x2000; else if (y >= 0xe000) y -= 0x800;
          return x < y ? -1 : 1;
        }
      }
      return a.length === b.length ? 0 : (a.length < b.length ? -1 : 1);
    }
    // Python str.lower(): per code point, so no context-dependent final sigma.
    function lowerPy(s) { return Array.from(s, (c) => c.toLowerCase()).join(''); }
    // Compares tuples of numbers and strings, lexicographically.
    function cmpKey(x, y) {
      for (let i = 0; i < x.length; i++) {
        const r = typeof x[i] === 'number' ? x[i] - y[i] : cpCmp(x[i], y[i]);
        if (r) return r;
      }
      return 0;
    }
    // Python `a or b or []` on lists.
    function nonEmpty(a, b) { return a && a.length ? a : (b && b.length ? b : []); }
    // Python `dict.get(key, default)`.
    function getOr(obj, key, dflt) {
      return obj && Object.prototype.hasOwnProperty.call(obj, key) ? obj[key] : dflt;
    }
    // Python `face.get("image_uris") or top.get("image_uris") or {}` (empty dict is falsy).
    function pickImages(face, top) {
      if (face.image_uris && Object.keys(face.image_uris).length) return face.image_uris;
      if (top.image_uris && Object.keys(top.image_uris).length) return top.image_uris;
      return {};
    }

    // An Art Series card (layout art_series) is never an alternative, even when Scryfall marks it borderless.
    function altTags(card) {
      if (card.layout === 'art_series') return [];
      const tags = new Set();
      if (card.full_art) tags.add('full_art');
      if (card.border_color === 'borderless') tags.add('borderless');
      if (card.textless) tags.add('textless');
      for (const fx of card.frame_effects || []) {
        if (fx === 'showcase' || fx === 'extendedart') tags.add(fx);
        else if (fx === 'fullart') tags.add('full_art');
      }
      for (const pt of card.promo_types || []) if (ALT_PROMO_TYPES.has(pt)) tags.add(pt);
      return [...tags].sort();
    }

    function slug(name) {
      const s = name.normalize('NFKD').replace(/[^\x00-\x7f]/g, '').toLowerCase();
      return 'name:' + s.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
    }

    function cardEntries(card) {
      const faces = card.illustration_id
        ? [[card, card]]
        : (card.card_faces || []).filter((f) => f.illustration_id).map((f) => [f, card]);
      const out = [];
      for (const [face, top] of faces) {
        let ids = nonEmpty(face.artist_ids, top.artist_ids);
        const fid = face.artist_id;
        if (fid && face !== top) ids = [fid];
        const artist = face.artist || top.artist || '';
        let names = artist ? artist.split(' & ').map((n) => n.trim()) : [];
        if (!ids.length) {
          if (!artist) continue;
          ids = [slug(artist)];
          names = [artist];
        }
        if (names.length !== ids.length) names = ids.length === 1 ? [artist] : [];
        out.push({
          ill: face.illustration_id, ids, names,
          name: face.name || top.name, images: pickImages(face, top),
        });
      }
      return out;
    }

    function bestPrint(ps) {
      let best = null, bestKey = null;
      for (const p of ps) {
        const key = [p.placeholder ? 1 : 0, p.art_series ? 1 : 0, -p.alt.length, p.released, p.set];
        if (best === null || cmpKey(key, bestKey) < 0) { best = p; bestKey = key; }
      }
      return best;
    }

    // Collector number order: leading number, then the whole number string.
    function numberKey(n) {
      const m = /^[0-9]+/.exec(n);
      return [m ? parseInt(m[0], 10) : 1e9, n];
    }

    // As bestPrint, inside one set: on a tie, the lowest collector number.
    function bestSetPrint(ps) {
      let best = null, bestKey = null;
      for (const p of ps) {
        const key = [p.placeholder ? 1 : 0, p.art_series ? 1 : 0, -p.alt.length, p.released, p.number];
        if (best === null || cmpKey(key, bestKey) < 0) { best = p; bestKey = key; }
      }
      return best;
    }

    // Illustration of a set. Slim: `art_crop` only without `image` (otherwise its
    // URL derives from the `image` one).
    function makeSetWork(ps) {
      const b = bestSetPrint(ps);
      const w = {
        illustration_id: b.illustration_id, name: b.name, number: b.number,
        released: b.released, image: b.image, uri: b.uri, printings: ps.length, alt: b.alt,
        artist_ids: [...new Set(ps.flatMap((p) => p.artist_ids))],
      };
      if (!b.image) w.art_crop = b.art_crop;
      return w;
    }

    function makeWork(ps) {
      const b = bestPrint(ps);
      return {
        illustration_id: b.illustration_id, name: b.name, set: b.set,
        set_name: b.set_name, released: b.released, image: b.image,
        art_crop: b.art_crop, uri: b.uri, printings: ps.length, alt: b.alt,
      };
    }

    // PREVIEW_SIZE illustrations: alternatives first, then the others; those only
    // existing as an Art Series card (souvenirs) come last. Distinct card names first.
    function pickPreview(works, souvenirs) {
      const ranked = works.slice().sort((a, b) =>
        (b.alt.length - a.alt.length) || cpCmp(a.released || '', b.released || '') || cpCmp(a.name, b.name));
      const alts = ranked.filter((w) => w.alt.length);
      const rest = ranked.filter((w) => !w.alt.length && !souvenirs.has(w.illustration_id));
      const last = ranked.filter((w) => !w.alt.length && souvenirs.has(w.illustration_id));
      const chosen = [], names = new Set();
      for (const pool of [alts, rest, last]) {
        for (const fresh of [true, false]) {
          for (const w of pool) {
            if (chosen.length === PREVIEW_SIZE) break;
            if (chosen.includes(w) || (fresh && names.has(w.name))) continue;
            chosen.push(w);
            names.add(w.name);
          }
        }
      }
      return chosen.map((w) => w.illustration_id);
    }

    function mostCommon(counts) {
      let best = null, bestN = -1;
      for (const [k, n] of counts) if (n > bestN) { best = k; bestN = n; }
      return best;
    }

    class Aggregator {
      constructor() {
        this.prints = new Map();  // artist id -> Map(illustration_id -> prints[])
        this.votes = new Map();   // artist id -> Map(name -> count)
        this.years = new Map();   // artist id -> years[]
        this.setPrints = new Map();   // set code -> Map(illustration_id -> prints[])
        this.sets = new Map();    // set code -> { name, type, released (its oldest card date) }
        this.cards = 0;
      }
      add(card) {
        this.cards++;
        const released = card.released_at || '';
        const tags = altTags(card);
        const placeholder = card.image_status === 'placeholder' || card.image_status === 'missing';
        const artSeries = card.layout === 'art_series';
        const code = card.set;
        let meta = this.sets.get(code);
        if (!meta) { meta = { name: card.set_name, type: getOr(card, 'set_type', ''), released: '' }; this.sets.set(code, meta); }
        if (released && (!meta.released || released < meta.released)) meta.released = released;
        for (const e of cardEntries(card)) {
          const img = e.images;
          const p = {
            illustration_id: e.ill, name: e.name, set: code, set_name: card.set_name,
            released, image: getOr(img, 'normal', ''), art_crop: getOr(img, 'art_crop', ''),
            uri: card.scryfall_uri, alt: tags, placeholder, art_series: artSeries,
            number: getOr(card, 'collector_number', ''), artist_ids: e.ids,
          };
          let inSet = this.setPrints.get(code);
          if (!inSet) { inSet = new Map(); this.setPrints.set(code, inSet); }
          let sl = inSet.get(e.ill);
          if (!sl) { sl = []; inSet.set(e.ill, sl); }
          sl.push(p);
          e.ids.forEach((aid, i) => {
            let byIll = this.prints.get(aid);
            if (!byIll) { byIll = new Map(); this.prints.set(aid, byIll); }
            let list = byIll.get(e.ill);
            if (!list) { list = []; byIll.set(e.ill, list); }
            list.push(p);
            if (e.names.length) {
              let v = this.votes.get(aid);
              if (!v) { v = new Map(); this.votes.set(aid, v); }
              const nm = e.names[i];
              v.set(nm, (v.get(nm) || 0) + 1);
            }
            if (released) {
              let y = this.years.get(aid);
              if (!y) { y = []; this.years.set(aid, y); }
              y.push(parseInt(released.slice(0, 4), 10));
            }
          });
        }
      }
      result(updatedAt) {
        const artists = [];
        const souvenirs = new Set();  // illustrations whose only showable print is an Art Series card
        for (const byIll of this.prints.values()) {
          for (const [ill, ps] of byIll) if (bestPrint(ps).art_series) souvenirs.add(ill);
        }
        for (const [aid, byIll] of this.prints) {
          const works = [];
          for (const ps of byIll.values()) works.push(makeWork(ps));
          works.sort((a, b) => cmpKey(
            [a.released, a.name, a.illustration_id],
            [b.released, b.name, b.illustration_id]));
          const votes = this.votes.get(aid);
          const years = this.years.get(aid) || [];
          artists.push({
            id: aid,
            name: votes ? mostCommon(votes) : aid,
            illustrations: works.length,
            printings: works.reduce((s, w) => s + w.printings, 0),
            cards: new Set(works.map((w) => w.name)).size,
            alt_illustrations: works.filter((w) => w.alt.length).length,
            first_year: years.length ? years.reduce((m, y) => (y < m ? y : m)) : null,
            last_year: years.length ? years.reduce((m, y) => (y > m ? y : m)) : null,
            preview: pickPreview(works, souvenirs),
            works,
          });
        }
        artists.sort((a, b) => cpCmp(lowerPy(a.name), lowerPy(b.name)));
        const sets = [];
        for (const [code, inSet] of this.setPrints) {
          const works = [];
          for (const ps of inSet.values()) works.push(makeSetWork(ps));
          works.sort((a, b) => cmpKey(
            [...numberKey(a.number), a.name, a.illustration_id],
            [...numberKey(b.number), b.name, b.illustration_id]));
          const meta = this.sets.get(code);
          sets.push({
            code, name: meta.name, type: meta.type, released: meta.released,
            illustrations: works.length,
            printings: works.reduce((s, w) => s + w.printings, 0),
            artists: new Set(works.flatMap((w) => w.artist_ids)).size,
            alt_illustrations: works.filter((w) => w.alt.length).length,
            preview: pickPreview(works, souvenirs),
            works,
          });
        }
        sets.sort((a, b) => cmpKey([a.released, a.code], [b.released, b.code]));
        return {
          generated_at: new Date().toISOString().replace(/\.\d{3}Z$/, '+00:00'),
          source: { bulk: BULK_TYPE, updated_at: updatedAt },
          artists,
          sets,
        };
      }
    }

    async function run() {
      try {
        const meta = await fetch(BULK_URL, { headers: { Accept: 'application/json' } });
        if (!meta.ok) throw new Error('bulk-data HTTP ' + meta.status);
        const entry = (await meta.json()).data.find((e) => e.type === BULK_TYPE);
        if (!entry) throw new Error('no ' + BULK_TYPE + ' entry');
        self.postMessage({ type: 'bulk', size: entry.compressed_size || 0, updated_at: entry.updated_at });

        // The bulk entry carries jsonl_download_uri (JSON Lines, gzipped), as build.py.
        const res = await fetch(entry.jsonl_download_uri || entry.download_uri);
        if (!res.ok) throw new Error('download HTTP ' + res.status);
        let got = 0;
        const counter = new TransformStream({
          transform(chunk, ctl) {
            got += chunk.byteLength;
            self.postMessage({ type: 'bytes', n: got });
            ctl.enqueue(chunk);
          },
        });
        const reader = res.body
          .pipeThrough(counter)
          .pipeThrough(new DecompressionStream('gzip'))
          .pipeThrough(new TextDecoderStream())
          .getReader();

        const agg = new Aggregator();
        let buf = '';
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buf += value;
          let start = 0, nl;
          while ((nl = buf.indexOf('\n', start)) !== -1) {
            if (nl > start) {
              agg.add(JSON.parse(buf.slice(start, nl)));
              if (agg.cards % 2000 === 0) self.postMessage({ type: 'cards', n: agg.cards });
            }
            start = nl + 1;
          }
          buf = buf.slice(start);
        }
        if (buf.trim()) agg.add(JSON.parse(buf));
        self.postMessage({ type: 'cards', n: agg.cards });
        self.postMessage({ type: 'done', data: agg.result(entry.updated_at) });
      } catch (e) {
        self.postMessage({ type: 'error', message: (e && e.message) || String(e) });
      }
    }
    run();
  }

  // ---------- page ----------

  // ---------- IndexedDB cache (every access may fail: no cache, no crash) ----------

  function openCache() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
      const req = indexedDB.open(CACHE_DB, 1);
      req.onupgradeneeded = () => req.result.createObjectStore(CACHE_STORE);
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error || new Error('IndexedDB open failed'));
      req.onblocked = () => reject(new Error('IndexedDB blocked'));
    });
  }

  function cacheRun(mode, make) {
    return openCache().then((db) => new Promise((resolve, reject) => {
      const tx = db.transaction(CACHE_STORE, mode);
      const req = make(tx.objectStore(CACHE_STORE));
      let result;
      req.onsuccess = () => { result = req.result; };
      tx.oncomplete = () => { db.close(); resolve(result); };
      tx.onerror = tx.onabort = () => {
        db.close();
        reject(tx.error || new Error('IndexedDB transaction failed'));
      };
    }));
  }

  const cacheGet = () => cacheRun('readonly', (s) => s.get(CACHE_KEY)).catch(() => null);

  // ---------- incremental lists (a batch more each time the sentinel shows) ----------

  function makeLister(container, sentinel, render, batch) {
    const o = { items: [], shown: 0 };
    const more = () => {
      const end = Math.min(o.shown + batch, o.items.length);
      const frag = document.createDocumentFragment();
      for (let i = o.shown; i < end; i++) frag.appendChild(render(o.items[i]));
      container.appendChild(frag);
      o.shown = end;
      // Re-observing makes the observer report the sentinel's current position,
      // so the next batch loads while the sentinel is still on screen.
      obs.unobserve(sentinel);
      if (o.shown < o.items.length) obs.observe(sentinel);
    };
    const obs = new IntersectionObserver((entries) => {
      if (entries.some((e) => e.isIntersecting) && o.shown < o.items.length) more();
    });
    o.set = (items) => {
      o.items = items;
      o.shown = 0;
      container.textContent = '';
      obs.unobserve(sentinel);
      if (items.length) more();
    };
    return o;
  }

  const artistLister = makeLister($('list'), $('sentinel'), (a) => artistCard(a), BATCH);

  const cardLister = makeLister($('card-list'), $('card-sentinel'), (c) => cardCard(c), BATCH);
  const workLister = makeLister(dom.works, $('works-sentinel'), (w) => workEl(w), 120);

  // Numbers compare as numbers, names folded; missing values always go last.
  function cmpBy(x, y, dir) {
    if (x == null || x === '' || y == null || y === '') return (x == null || x === '') - (y == null || y === '');
    if (typeof x === 'number') return dir * (x - y);
    const fx = fold(x), fy = fold(y);
    return fx < fy ? -dir : fx > fy ? dir : 0;
  }

  // ---------- artist list ----------

  function applyArtists() {
    const q = fold(state.q.trim());
    const dir = state.desc ? -1 : 1;
    const f = (a) => index.folded.get(a.id);
    const arr = q ? index.artists.filter((a) => f(a).includes(q)) : index.artists.slice();
    arr.sort((a, b) => (state.sort === 'name' ? cmpBy(a.name, b.name, dir) : cmpBy(a[state.sort], b[state.sort], dir))
      || cmpBy(a.name, b.name, 1));
    dom.count.textContent = plural(arr.length, 'artist', 'artists');
    emptyMsg.artists = arr.length ? '' : 'No artist matches “' + state.q.trim() + '”.';
    artistLister.set(arr);
    showListParts();
  }

  function artistCard(a) {
    const stats = el('p', { class: 'stats-line' });
    stats.textContent = [
      plural(a.illustrations, 'illustration', 'illustrations'),
      plural(a.printings, 'printing', 'printings'),
      plural(a.cards, 'distinct card name', 'distinct card names'),
      a.alt_illustrations + ' alternative',
    ].join(' · ') + ' · ';
    stats.appendChild(el('span', { class: 'nowrap', text: yearsText(a) }));
    return listCard(a.name, stats, a.preview, a.works, '#artist=' + encodeURIComponent(a.id));
  }

  // ---------- set list ----------

  function applySets() {
    const q = fold(setState.q.trim());
    const dir = setState.desc ? -1 : 1;
    let arr = index.sets;
    if (setState.type) arr = arr.filter((st) => st.type === setState.type);
    if (q) arr = arr.filter((st) => index.setFolded.get(st.code).includes(q));
    arr = arr.slice().sort((a, b) => cmpBy(a[setState.sort], b[setState.sort], dir) || cmpBy(a.name, b.name, 1));
    // A search equal to a set code puts that set first.
    const exact = arr.findIndex((st) => st.code.toLowerCase() === q);
    if (exact > 0) arr.unshift(arr.splice(exact, 1)[0]);
    dom.setCount.textContent = plural(arr.length, 'set', 'sets');
    emptyMsg.sets = arr.length ? '' : 'No set matches' + (q ? ' “' + setState.q.trim() + '”' : '') +
      (setState.type ? ' in type ' + setTypeLabel(setState.type) : '') + '.';
    setLister.set(arr);
    showListParts();
  }

  function setCard(st) {
    const stats = el('p', { class: 'stats-line' });
    stats.textContent = [
      st.code.toUpperCase(), setTypeLabel(st.type),
      plural(st.illustrations, 'illustration', 'illustrations'),
      plural(st.artists, 'artist', 'artists'),
      plural(st.printings, 'printing', 'printings'),
      st.alt_illustrations + ' alternative',
    ].join(' · ') + ' · ';
    stats.appendChild(el('span', { class: 'nowrap', text: st.released || '—' }));
    return listCard(st.name, stats, st.preview, st.works, '#set=' + encodeURIComponent(st.code));
  }

  // ---------- cards (one per card name), built in the page from the sets ----------
  // Each set lists its illustrations with the name of the print it shows, so an
  // illustration reused under another name (a token, a reprint) counts for both.
  function buildCards(sets) {
    const byName = new Map();   // name -> { ills: Map(illustration_id -> entry), codes: Set, first, last }
    for (const st of sets) {
      for (const w of st.works) {
        let c = byName.get(w.name);
        if (!c) { c = { ills: new Map(), codes: new Set(), first: '', last: '' }; byName.set(w.name, c); }
        c.codes.add(st.code);
        if (w.released && (!c.first || w.released < c.first)) c.first = w.released;
        if (w.released && w.released > c.last) c.last = w.released;
        let e = c.ills.get(w.illustration_id);
        if (!e) { e = { w, st, printings: 0, artists: [] }; c.ills.set(w.illustration_id, e); }
        else if (betterPrint(w, st, e.w, e.st) > 0) { e.w = w; e.st = st; }
        e.printings += w.printings;
        for (const a of w.artist_ids) if (!e.artists.includes(a)) e.artists.push(a);
      }
    }
    const cards = [];
    for (const [name, c] of byName) {
      const works = [...c.ills.values()].map((e) => ({
        illustration_id: e.w.illustration_id, name, set: e.st.code, set_name: e.st.name,
        released: e.w.released, image: e.w.image, art_crop: e.w.art_crop, uri: e.w.uri,
        printings: e.printings, alt: e.w.alt, artist_ids: e.artists,
      }));
      works.sort((a, b) => cmpBy(a.released, b.released, 1) || cmpBy(a.set_name, b.set_name, 1));
      const artists = new Set(works.flatMap((w) => w.artist_ids));
      cards.push({
        name, illustrations: works.length,
        printings: works.reduce((n, w) => n + w.printings, 0),
        artists: artists.size, sets: c.codes.size,
        alt_illustrations: works.filter((w) => w.alt.length).length,
        first_year: c.first ? +c.first.slice(0, 4) : null, last_year: c.last ? +c.last.slice(0, 4) : null,
        // Preview: most alternative first, then oldest.
        preview: works.slice().sort((a, b) => (b.alt.length - a.alt.length) || cmpBy(a.released, b.released, 1))
          .slice(0, 4).map((w) => w.illustration_id),
        works,
      });
    }
    return cards;
  }

  // The print shown for an illustration of a card: with a scan, then most alternative,
  // then oldest, then by set code.
  function betterPrint(w, st, bw, bst) {
    return (!!w.image - !!bw.image) || (w.alt.length - bw.alt.length) ||
      -cmpBy(w.released, bw.released, 1) || (st.code < bst.code ? 1 : 0);
  }

  function applyCards() {
    const q = fold(cardState.q.trim());
    const dir = cardState.desc ? -1 : 1;
    const f = (c) => index.cardFolded.get(c.name);
    const arr = q ? index.cards.filter((c) => f(c).includes(q)) : index.cards.slice();
    arr.sort((a, b) => (cardState.sort === 'name' ? cmpBy(a.name, b.name, dir) : cmpBy(a[cardState.sort], b[cardState.sort], dir))
      || cmpBy(a.name, b.name, 1));
    // A search equal to a card name puts that card first.
    const exact = arr.findIndex((c) => f(c) === q);
    if (exact > 0) arr.unshift(arr.splice(exact, 1)[0]);
    dom.cardCount.textContent = plural(arr.length, 'card', 'cards');
    emptyMsg.cards = arr.length ? '' : 'No card matches “' + cardState.q.trim() + '”.';
    cardLister.set(arr);
    showListParts();
  }

  function cardCard(c) {
    const stats = el('p', { class: 'stats-line' });
    stats.textContent = [
      plural(c.illustrations, 'illustration', 'illustrations'),
      plural(c.printings, 'printing', 'printings'),
      plural(c.artists, 'artist', 'artists'),
      plural(c.sets, 'set', 'sets'),
      c.alt_illustrations + ' alternative',
    ].join(' · ') + ' · ';
    stats.appendChild(el('span', { class: 'nowrap', text: yearsText(c) }));
    return listCard(c.name, stats, c.preview, c.works, '#card=' + encodeURIComponent(c.name));
  }

  // One list card: 2 x 2 previews, text over them, the whole card links to its page.
  function listCard(name, stats, preview, works, href) {
    const cap = el('div', { class: 'cap' }, [el('h2', { text: name }), stats]);
    const cells = preview.slice(0, 4).map((id) => previewEl(works.find((x) => x.illustration_id === id)));
    while (cells.length < 4) cells.push(el('div', { class: 'preview empty' }));
    const hit = el('a', { class: 'hit', href, 'aria-label': name });
    return el('article', { class: 'artist' }, [el('div', { class: 'previews' }, cells), cap, hit]);
  }

  function badgesEl(alt, cls) {
    if (!alt || alt.length === 0) return null;
    return el('span', { class: cls }, alt.map((v) => el('span', { class: 'badge', text: altLabel(v) })));
  }

  function previewEl(w) {
    const art = artCrop(w);
    const children = [art
      ? el('img', { src: art, alt: w.name, loading: 'lazy', decoding: 'async' })
      : el('span', { class: 'placeholder', text: w.name })];
    const badges = badgesEl(w.alt, 'badges');
    if (badges) children.push(badges);
    return el('div', { class: 'preview' }, children);
  }

  // ---------- detail pages (an artist or a set) ----------

  function openDetail(kind, key) {
    const item = kind === 'artist' ? index.byId.get(key) : kind === 'set' ? index.byCode.get(key) : index.byName.get(key);
    detail = { kind, item };
    hideZoom();
    dom.listView.hidden = dom.setListView.hidden = dom.cardListView.hidden = dom.status.hidden = true;
    dom.bar.hidden = true;
    dom.detail.hidden = false;
    window.scrollTo(0, 0);
    dom.artistWorkSorting.hidden = kind !== 'artist';
    dom.setWorkSorting.hidden = kind !== 'set';
    dom.cardWorkSorting.hidden = kind !== 'card';
    dom.detailMeta.textContent = '';
    if (!item) {
      dom.detailName.textContent = { artist: 'Artist', set: 'Set', card: 'Card' }[kind] + ' not found';
    } else if (kind === 'artist') {
      dom.detailName.textContent = item.name;
      dom.detailMeta.textContent = [
        plural(item.illustrations, 'illustration', 'illustrations'),
        plural(item.printings, 'printing', 'printings'),
        plural(item.cards, 'distinct card name', 'distinct card names'),
        plural(item.alt_illustrations, 'alternative illustration', 'alternative illustrations'),
        yearsText(item)].join(' · ');
    } else if (kind === 'card') {
      dom.detailName.textContent = item.name;
      dom.detailMeta.append(text([
        plural(item.illustrations, 'illustration', 'illustrations'),
        plural(item.printings, 'printing', 'printings'),
        plural(item.artists, 'artist', 'artists'),
        plural(item.sets, 'set', 'sets'),
        plural(item.alt_illustrations, 'alternative illustration', 'alternative illustrations'),
        yearsText(item)].join(' · ') + ' · '),
        el('a', { href: 'https://scryfall.com/search?q=' + encodeURIComponent('!"' + item.name + '" unique:art'),
          target: '_blank', rel: 'noopener', text: 'Scryfall page' }));
    } else {
      dom.detailName.textContent = item.name;
      dom.detailMeta.append(text([
        item.code.toUpperCase(), setTypeLabel(item.type), item.released || '—',
        plural(item.illustrations, 'illustration', 'illustrations'),
        plural(item.artists, 'artist', 'artists'),
        plural(item.printings, 'printing', 'printings'),
        plural(item.alt_illustrations, 'alternative illustration', 'alternative illustrations')].join(' · ') + ' · '),
        el('a', { href: 'https://scryfall.com/sets/' + encodeURIComponent(item.code), target: '_blank', rel: 'noopener', text: 'Scryfall page' }));
    }
    detailWorks = item ? item.works : [];
    renderWorks();
  }

  const artistName = (id) => { const a = index.byId.get(id); return a ? a.name : id; };

  function renderWorks() {
    const kind = detail ? detail.kind : 'artist';
    const onlyAlt = dom.altOnly.checked;
    const list = onlyAlt ? detailWorks.filter((w) => w.alt && w.alt.length) : detailWorks;
    const ws = { artist: workState, set: setWorkState, card: cardWorkState }[kind];
    const dir = ws.desc ? -1 : 1;
    const keyOf = (w) => {
      if (ws.sort === 'artist') return artistName(w.artist_ids[0] || '');
      return w[ws.sort];
    };
    // Works arrive in their natural order (release date, or collector number); the sort
    // is stable, so ties keep that order.
    const items = list.slice().sort((a, b) => {
      if (ws.sort === 'number') {
        const x = a.number.match(/^[0-9]+/), y = b.number.match(/^[0-9]+/);
        return dir * ((x ? +x[0] : 1e9) - (y ? +y[0] : 1e9)) || cmpBy(a.number, b.number, dir);
      }
      return cmpBy(keyOf(a), keyOf(b), dir);
    });
    if (items.length === 0 && detailWorks.length) {
      dom.detailStatus.hidden = false;
      dom.detailStatus.textContent = 'No alternative illustration.';
    } else {
      dom.detailStatus.hidden = true;
    }
    workLister.set(items);
  }

  function workEl(w) {
    const kind = detail ? detail.kind : 'artist';
    const art = artCrop(w);
    const media = art || w.image
      ? el('img', { src: art || w.image, alt: w.name, loading: 'lazy', decoding: 'async' })
      : el('span', { class: 'placeholder', text: w.name });
    const hit = w.image || art
      ? el('button', { type: 'button', class: 'zoom-btn', 'aria-label': 'Enlarge ' + w.name,
          'data-image': w.image, 'data-art': art, 'data-name': w.name, 'data-uri': w.uri,
          'data-ill': w.illustration_id, 'data-set': kind === 'set' ? detail.item.code : w.set }, [media])
      : media;
    const meta = el('span', { class: 'cap-meta' });
    const artistLinks = () => w.artist_ids.forEach((id, i) => {
      if (i) meta.append(text(' & '));
      meta.append(el('a', { class: 'cap-link', href: '#artist=' + encodeURIComponent(id), text: artistName(id) }));
    });
    if (kind === 'card') {
      artistLinks();
      meta.append(text(w.artist_ids.length ? ' · ' : ''),
        el('a', { class: 'cap-link', href: '#set=' + encodeURIComponent(w.set), text: w.set_name }),
        text(' · ' + (w.released ? w.released.slice(0, 4) : '—') + ' · ' + plural(w.printings, 'printing', 'printings')));
    } else if (kind === 'artist') {
      const year = w.released ? w.released.slice(0, 4) : '—';
      meta.append(
        el('a', { class: 'cap-link', href: '#set=' + encodeURIComponent(w.set), text: w.set_name }),
        text(' · ' + year + ' · ' + plural(w.printings, 'printing', 'printings')));
    } else {
      artistLinks();
      const year = w.released ? w.released.slice(0, 4) : '—';
      meta.append(text((w.artist_ids.length ? ' · ' : '') + '#' + w.number + ' · ' + year + ' · ' + plural(w.printings, 'printing', 'printings')));
    }
    const cap = el('span', { class: 'cap' }, [
      // The card name leads to the card page (plain text on the card page itself).
      kind === 'card' ? el('span', { class: 'cap-name', text: w.name })
        : el('a', { class: 'cap-name', href: '#card=' + encodeURIComponent(w.name), text: w.name }), meta,
    ]);
    const children = [hit, cap];
    const badges = badgesEl(w.alt, 'badges');
    if (badges) children.push(badges);
    return el('div', { class: 'work' }, [el('div', { class: 'work-frame' }, children)]);
  }

  // ---------- routing: '' artists, #sets, #cards, #artist=<id>, #set=<code>, #card=<name> ----------

  // Visibility of the list parts for the current tab.
  function showListParts() {
    if (detail) return;
    dom.artistControls.hidden = tab !== 'artists';
    dom.setControls.hidden = tab !== 'sets';
    dom.cardControls.hidden = tab !== 'cards';
    dom.tabArtists.setAttribute('aria-current', tab === 'artists' ? 'page' : 'false');
    dom.tabSets.setAttribute('aria-current', tab === 'sets' ? 'page' : 'false');
    dom.tabCards.setAttribute('aria-current', tab === 'cards' ? 'page' : 'false');
    dom.listView.hidden = tab !== 'artists' || !!emptyMsg.artists;
    dom.setListView.hidden = tab !== 'sets' || !!emptyMsg.sets;
    dom.cardListView.hidden = tab !== 'cards' || !!emptyMsg.cards;
    dom.status.hidden = !emptyMsg[tab];
    dom.status.textContent = emptyMsg[tab];
  }

  function showList(t) {
    if (!detail && t !== tab) listScroll[tab] = window.scrollY;
    detail = null;
    tab = t;
    hideZoom();
    dom.detail.hidden = true;
    dom.bar.hidden = false;
    showListParts();
    window.scrollTo(0, listScroll[t]);
  }

  function route() {
    if (!index) return;   // no data yet: routed again when it arrives
    const h = location.hash;
    const m = h.match(/^#(artist|set|card)=(.+)$/);
    if (m) {
      let key = null;
      try { key = decodeURIComponent(m[2]); } catch (e) { key = null; }
      if (!detail) listScroll[tab] = window.scrollY;
      openDetail(m[1], key);
    } else {
      showList(h === '#sets' ? 'sets' : h === '#cards' ? 'cards' : 'artists');
    }
  }

  window.addEventListener('hashchange', () => {
    const h = location.hash;
    if (navStack.length > 1 && navStack[navStack.length - 2] === h) navStack.pop();
    else navStack.push(h);
    route();
  });

  dom.back.addEventListener('click', () => {
    if (navStack.length > 1) history.back();
    else location.hash = detail ? { artist: '', set: '#sets', card: '#cards' }[detail.kind] : '';
  });

  // ---------- controls ----------

  dom.q.addEventListener('input', () => { state.q = dom.q.value; if (index) applyArtists(); });
  dom.sort.addEventListener('change', () => { state.sort = dom.sort.value; if (index) applyArtists(); });
  dom.dir.addEventListener('click', () => {
    state.desc = !state.desc;
    dom.dir.textContent = state.desc ? 'Descending' : 'Ascending';
    if (index) applyArtists();
  });
  dom.setQ.addEventListener('input', () => { setState.q = dom.setQ.value; if (index) applySets(); });
  dom.setType.addEventListener('change', () => { setState.type = dom.setType.value; if (index) applySets(); });
  dom.setSort.addEventListener('change', () => { setState.sort = dom.setSort.value; if (index) applySets(); });
  dom.setDir.addEventListener('click', () => {
    setState.desc = !setState.desc;
    dom.setDir.textContent = setState.desc ? 'Descending' : 'Ascending';
    if (index) applySets();
  });
  dom.cardQ.addEventListener('input', () => { cardState.q = dom.cardQ.value; if (index) applyCards(); });
  dom.cardSort.addEventListener('change', () => { cardState.sort = dom.cardSort.value; if (index) applyCards(); });
  dom.cardDir.addEventListener('click', () => {
    cardState.desc = !cardState.desc;
    dom.cardDir.textContent = cardState.desc ? 'Descending' : 'Ascending';
    if (index) applyCards();
  });
  dom.cardWorkSort.addEventListener('change', () => { cardWorkState.sort = dom.cardWorkSort.value; renderWorks(); });
  dom.cardWorkDir.addEventListener('click', () => {
    cardWorkState.desc = !cardWorkState.desc;
    dom.cardWorkDir.textContent = cardWorkState.desc ? 'Descending' : 'Ascending';
    renderWorks();
  });
  dom.altOnly.addEventListener('change', renderWorks);
  dom.workSort.addEventListener('change', () => { workState.sort = dom.workSort.value; renderWorks(); });
  dom.workDir.addEventListener('click', () => {
    workState.desc = !workState.desc;
    dom.workDir.textContent = workState.desc ? 'Descending' : 'Ascending';
    renderWorks();
  });
  dom.setWorkSort.addEventListener('change', () => { setWorkState.sort = dom.setWorkSort.value; renderWorks(); });
  dom.setWorkDir.addEventListener('click', () => {
    setWorkState.desc = !setWorkState.desc;
    dom.setWorkDir.textContent = setWorkState.desc ? 'Descending' : 'Ascending';
    renderWorks();
  });

  // ---------- enlarged card and its image formats ----------
  // Click opens, a click on the backdrop or Escape closes, the menu or Up/Down picks a format.

  // Scryfall image formats, as [key, label, file type, rounded card corners].
  // Every URL is the `normal` one with /normal/ replaced by /<key>/ and the matching
  // extension (checked on all 124,127 images of the default_cards bulk).
  const FORMATS = [
    ['png', 'HD', 'png', true], ['large', 'Large', 'jpg', true], ['normal', 'Normal', 'jpg', true],
    ['small', 'Small', 'jpg', true], ['border_crop', 'Border crop', 'jpg', false],
    ['art_crop', 'Art crop', 'jpg', false], ['display', 'Display', 'webp', true],
    ['grid', 'Grid', 'webp', true], ['thumb', 'Thumb', 'webp', true],
    ['crop', 'Crop', 'webp', false], ['art', 'Art', 'webp', false],
  ];
  const formatUrl = (normal, key, ext) =>
    normal.replace('/normal/', '/' + key + '/').replace(/\.jpg(\?|$)/, '.' + ext + '$1');

  const zoomBox = $('zoom'), zoomImg = $('zoom-img'), zoomCap = $('zoom-cap'), zoomMenu = $('zoom-menu');
  const zoomStage = $('zoom-stage');
  const HD_SIZE = [745, 1040];   // Scryfall png, the largest card format
  let zoomCard = null;    // { name, uri, scanned, formats: [{ label, type, url, round }] }
  let zoomAt = 0;         // index of the format shown

  function hideZoom() {
    zoomBox.hidden = true;
    zoomCard = null;
    zoomImg.removeAttribute('src');
    zoomImg.style.width = '';
  }

  function openZoom(btn) {
    const { image, art, name, uri, ill } = btn.dataset;
    // Its set, and its artists as that set lists them (all of them for a shared card).
    const st = index.byCode.get(btn.dataset.set);
    const sw = st && st.works.find((x) => x.illustration_id === ill);
    const formats = image
      ? FORMATS.map(([key, label, type, round]) => ({ label, type: type.toUpperCase(), url: formatUrl(image, key, type), round }))
      : [{ label: 'Art crop', type: 'JPG', url: art, round: false }];   // card without a scan
    zoomCard = { name, uri, scanned: !!image, formats, set: st, artistIds: sw ? sw.artist_ids : [] };
    zoomMenu.textContent = '';
    formats.forEach((f, i) => {
      const b = el('button', { type: 'button', class: 'fmt', 'data-i': i }, [
        el('span', { text: f.label }), el('span', { class: 'fmt-type', text: f.type }),
      ]);
      zoomMenu.appendChild(b);
    });
    zoomBox.hidden = false;
    sizeStage();
    showFormat(0);
    zoomMenu.querySelector('.fmt').focus();
  }

  function showFormat(i) {
    const f = zoomCard.formats[i];
    zoomAt = i;
    zoomMenu.querySelectorAll('.fmt').forEach((b, j) => b.setAttribute('aria-current', j === i ? 'true' : 'false'));
    zoomImg.className = f.round ? 'round' : '';
    zoomImg.alt = zoomCard.name + ' (' + f.label + ')';
    zoomImg.src = f.url;
    captionZoom('');
  }

  function captionZoom(size) {
    const f = zoomCard.formats[zoomAt];
    zoomCap.textContent = '';
    // The card, its artists and its set (pages of this site), one per line.
    zoomCap.append(el('a', { class: 'zi-name', href: '#card=' + encodeURIComponent(zoomCard.name), text: zoomCard.name }));
    if (zoomCard.artistIds.length) {
      const by = el('div', {}, [text('by ')]);
      zoomCard.artistIds.forEach((id, i) => {
        if (i) by.append(text(' & '));
        by.append(el('a', { href: '#artist=' + encodeURIComponent(id), text: artistName(id) }));
      });
      zoomCap.append(by);
    }
    if (zoomCard.set) {
      zoomCap.append(el('div', {}, [el('a', { href: '#set=' + encodeURIComponent(zoomCard.set.code), text: zoomCard.set.name })]));
    }
    // The format shown, the file, and this print on Scryfall.
    zoomCap.append(el('div', { class: 'zi-file' }, [
      text(f.label + ' ' + f.type + (size ? ' · ' + size : '')), el('br'),
      el('a', { href: f.url, target: '_blank', rel: 'noopener', text: 'Open file' }),
      text(' · '),
      el('a', { href: zoomCard.uri, target: '_blank', rel: 'noopener', text: 'Scryfall' })]));
  }

  // Stage: the HD card fitted beside (or above, on narrow screens) the menu; the whole
  // free area for a card without a scan. Each format shows at its own size, shrunk to fit it.
  // Sizes are measured on the zoom layer itself (a scrollbar is not part of it) and on
  // the side panel, minus a safety margin, rather than taken from constants.
  const ZOOM_MARGIN = 50;
  function sizeStage() {
    const narrow = getComputedStyle(zoomBox.querySelector('.zoom-panel')).flexDirection === 'column';
    const side = zoomBox.querySelector('.zoom-side');
    const gap = parseFloat(getComputedStyle(zoomBox.querySelector('.zoom-panel')).columnGap) || 0;
    const boxW = zoomBox.clientWidth - 32, boxH = zoomBox.clientHeight - 32;   // minus #zoom padding
    const maxW = Math.max(100, boxW - (narrow ? 0 : side.offsetWidth + gap + ZOOM_MARGIN));
    const maxH = Math.max(100, narrow ? boxH * 0.5 : boxH - ZOOM_MARGIN);   // narrow: the side panel goes below
    let w = maxW, h = maxH;
    if (zoomCard.scanned) {
      const k = Math.min(1, maxW / HD_SIZE[0], maxH / HD_SIZE[1]);
      w = Math.floor(HD_SIZE[0] * k); h = Math.floor(HD_SIZE[1] * k);
    }
    zoomStage.style.width = w + 'px';
    zoomStage.style.height = h + 'px';
  }
  function fitZoom() {
    if (!zoomCard || !zoomImg.naturalWidth) return;
    const k = Math.min(1, zoomStage.clientWidth / zoomImg.naturalWidth, zoomStage.clientHeight / zoomImg.naturalHeight);
    zoomImg.style.width = Math.floor(zoomImg.naturalWidth * k) + 'px';
  }
  zoomImg.addEventListener('load', () => {
    if (!zoomCard) return;
    captionZoom(zoomImg.naturalWidth + ' × ' + zoomImg.naturalHeight);
    fitZoom();
  });
  window.addEventListener('resize', () => { if (zoomCard) { sizeStage(); fitZoom(); } });

  dom.works.addEventListener('click', (e) => {
    const btn = e.target.closest('.zoom-btn');
    if (btn) openZoom(btn);
  });
  // An artist or set link leaves the zoom, even when it points to the page already open.
  zoomCap.addEventListener('click', (e) => {
    const a = e.target.closest('a[href^="#"]');
    if (a) hideZoom();
  });
  zoomMenu.addEventListener('click', (e) => {
    const b = e.target.closest('.fmt');
    if (b) showFormat(Number(b.dataset.i));
  });
  zoomBox.addEventListener('click', (e) => {
    if (!e.target.closest('figure, .zoom-side')) hideZoom();
  });
  document.addEventListener('keydown', (e) => {
    if (zoomBox.hidden) return;
    if (e.key === 'Escape') hideZoom();
    else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      const n = zoomCard.formats.length;
      showFormat((zoomAt + (e.key === 'ArrowDown' ? 1 : -1) + n) % n);
      zoomMenu.querySelectorAll('.fmt')[zoomAt].focus();
    }
  });
  dom.retry.addEventListener('click', startLoad);
  dom.refresh.addEventListener('click', startLoad);

  // ---------- start ----------

  // With a cache: show it at once; reload by itself when it is older than 30 days.
  // Without one, with one of an older shape (see DATA_VERSION), or without IndexedDB: load at once.
  cacheGet().then((rec) => {
    if (rec && rec.data && rec.version === DATA_VERSION) {
      showData(rec.data);
      if (Date.now() - rec.loaded_at > MAX_AGE_MS) startLoad();
    } else {
      startLoad();
    }
  });
})();
</script>
</body>
</html>
