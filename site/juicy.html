<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Juicy — vitrine</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="lib/juicy.css">
<link rel="stylesheet" href="lib/effects.css">
<link rel="stylesheet" href="lib/bursts.css">
<link rel="stylesheet" href="lib/widgets.css">
<link rel="stylesheet" href="lib/themes/rpg.css">
<link rel="stylesheet" href="lib/themes/neon.css">
<link rel="stylesheet" href="lib/themes/candy.css">
</head>
<body>

<div data-juicy-region="stage">
  <header>
    <h1 data-juicy-region="title">Juicy</h1>
    <p data-juicy-region="tagline">Bascule les thèmes, active tout, rien ne casse.</p>
  </header>
  <nav data-juicy-region="nav"></nav>
  <div data-juicy-region="controls"></div>
  <div data-juicy-region="actions"></div>
  <div data-juicy-region="scene">Scène</div>
  <div data-juicy-region="narration"></div>
  <div data-juicy-region="meta">Compteur : 0 · Combo : 0</div>
</div>

<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@3/tsparticles.slim.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js"></script>

<script defer src="lib/juicy.js"></script>
<script defer src="lib/effects.js"></script>
<script defer src="lib/bursts.js"></script>
<script defer src="lib/widgets.js"></script>
<script defer src="lib/themes/rpg.js"></script>
<script defer src="lib/themes/neon.js"></script>
<script defer src="lib/themes/candy.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function () {
  Juicy.init({ theme: 'rpg', controls: true });
});
</script>
</body>
</html>
