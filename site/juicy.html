<!doctype html>
<html lang="fr" data-theme="rpg">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Terrain de jeu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Fredoka:wght@400;600;700&family=Baloo+2:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="juicy/core.css">
<link rel="stylesheet" href="juicy/theme-rpg.css">
<link rel="stylesheet" href="juicy/theme-neon.css">
<link rel="stylesheet" href="juicy/theme-candy.css">
</head>
<body>
  <div id="fx-canvas-wrap"><canvas id="fx-canvas"></canvas></div>
  <div id="tsparticles"></div>
  <div id="theme-layer"></div>
  <div id="fx-overlay"></div>
  <div id="custom-cursor"></div>

  <header id="hero">
    <h1 id="title">Terrain de jeu</h1>
    <p id="tagline">Bascule les thèmes, active tout, rien ne casse.</p>
    <nav id="theme-switcher">
      <button class="theme-btn" data-theme-btn="rpg" type="button">RPG</button>
      <button class="theme-btn" data-theme-btn="neon" type="button">Neon</button>
      <button class="theme-btn" data-theme-btn="candy" type="button">Candy</button>
    </nav>
  </header>

  <main id="stage">
    <section class="panel" id="panel-toggles">
      <h2 class="panel-title" id="toggles-title">Options</h2>
      <div id="toggles"></div>
    </section>
    <section class="panel" id="panel-actions">
      <h2 class="panel-title" id="actions-title">Actions</h2>
      <div id="actions"></div>
    </section>
    <section class="panel" id="panel-scene">
      <div id="theme-stage"></div>
      <div id="comment"></div>
      <div id="counter"><span id="counter-value">0</span><span id="combo"></span></div>
    </section>
  </main>

  <div id="toast-layer"></div>

<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/@tsparticles/slim@3/tsparticles.slim.bundle.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/tone@15/build/Tone.js"></script>
<script defer src="juicy/core.js"></script>
<script defer src="juicy/theme-rpg.js"></script>
<script defer src="juicy/theme-neon.js"></script>
<script defer src="juicy/theme-candy.js"></script>
</body>
</html>
